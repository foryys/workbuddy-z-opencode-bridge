<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="OpenCode Go 桥接代理的数据流">
  <title>请求怎么走：WorkBuddy → 本机代理 → OpenCode Go</title>
  <desc>客户端只有三格可填，缺请求头入口。本机代理补上 x-opencode-session 后转发，另做会话身份、真实思考回填与出站选路，全部留在本机。</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="#FFFFFF"/>

  <!-- 主链路 -->
  <line x1="240" y1="178" x2="284" y2="178" stroke="#CBD5E1" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="714" y1="178" x2="754" y2="178" stroke="#CBD5E1" stroke-width="2" marker-end="url(#ar)"/>

  <!-- A 客户端 -->
  <rect x="40" y="104" width="200" height="150" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="56" y="132" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0F172A">WorkBuddy 客户端</text>
  <text x="56" y="156" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">只有三格可填</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#334155">
    <text x="56" y="178">· 接口地址</text>
    <text x="56" y="196">· API Key</text>
    <text x="56" y="214">· 模型名称</text>
  </g>
  <rect x="56" y="224" width="168" height="22" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="66" y="239" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#B91C1C">没有填请求头的地方</text>

  <!-- B 代理 -->
  <rect x="290" y="72" width="420" height="228" rx="10" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="306" y="94" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8">本机代理 · 127.0.0.1:8787</text>

  <rect x="306" y="106" width="388" height="44" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="318" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">① 补请求头</text>
  <text x="318" y="140" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">x-opencode-session，缺了鉴权前就 400</text>

  <rect x="306" y="158" width="388" height="44" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="318" y="176" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">② 定会话身份</text>
  <text x="318" y="192" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">按首条消息派生，多任务互不撞车</text>

  <rect x="306" y="210" width="388" height="44" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="318" y="228" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">③ 回填真实思考</text>
  <text x="318" y="244" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">上游吐过就还回去，没吐就留空、不伪造</text>

  <text x="306" y="272" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1E40AF">出站三态：经代理 / 直连 / 代理不通</text>
  <text x="306" y="288" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1E40AF">验到 TLS 握手成功才算通，每分钟复核</text>

  <!-- C 上游 -->
  <rect x="760" y="104" width="200" height="150" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="776" y="132" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0F172A">OpenCode Go</text>
  <text x="776" y="152" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748B">/inference/go</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#334155">
    <text x="776" y="180">认那个请求头</text>
    <text x="776" y="200">认你的 API Key</text>
  </g>
  <text x="776" y="226" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748B">模型名填裸 id</text>
  <text x="776" y="242" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748B">不带 opencode-go/ 前缀</text>

  <!-- 下排：留在本机 -->
  <text x="40" y="342" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">都留在本机</text>

  <rect x="40" y="356" width="290" height="92" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="54" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">终端控制台</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">
    <text x="54" y="402">状态、成败、在飞任务</text>
    <text x="54" y="420">每行带请求体大小与出站方式</text>
    <text x="54" y="438">中文列宽对齐</text>
  </g>

  <rect x="350" y="356" width="290" height="92" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="364" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">现场诊断</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">
    <text x="364" y="402">/diag 一次看全</text>
    <text x="364" y="420">刚测的出站 vs 在用的那条</text>
    <text x="364" y="438">最近失败、在飞任务</text>
  </g>

  <rect x="660" y="356" width="300" height="92" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="674" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">本地文件</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">
    <text x="674" y="402">reasoning-cache.json 思考存档</text>
    <text x="674" y="420">proxy.log 与失败转储</text>
    <text x="674" y="438">均不入库</text>
  </g>

  <text x="500" y="482" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748B">只监听 127.0.0.1；日志不记 Key，不外发任何内容</text>

  <!-- 动画：请求去 / 响应回 -->
  <g>
    <circle cx="240" cy="178" r="5" fill="#2563EB" opacity="0">
      <animate attributeName="cx" values="240;754" dur="3.2s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="3.2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="178" r="5" fill="#2563EB" opacity="0">
      <animate attributeName="cx" values="240;754" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="754" cy="194" r="4" fill="#0D9488" opacity="0">
      <animate attributeName="cx" values="754;240" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 代理内三步依次亮 -->
  <g fill="none" stroke="#2563EB" stroke-width="1.8">
    <rect x="306" y="106" width="388" height="44" rx="8" opacity="0">
      <animate attributeName="opacity" values="0;0.95;0.95;0;0" keyTimes="0;0.04;0.22;0.3;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="306" y="158" width="388" height="44" rx="8" opacity="0">
      <animate attributeName="opacity" values="0;0.95;0.95;0;0" keyTimes="0;0.04;0.22;0.3;1" dur="6s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="306" y="210" width="388" height="44" rx="8" opacity="0">
      <animate attributeName="opacity" values="0;0.95;0.95;0;0" keyTimes="0;0.04;0.22;0.3;1" dur="6s" begin="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
