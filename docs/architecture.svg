<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="OpenCode Go 桥接代理的数据流">
  <title>请求与响应怎么走</title>
  <desc>客户端只能填三项、缺请求头。请求经本机代理补上 x-opencode-session 后转发上游，响应沿原路回来。</desc>

  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="300" fill="#FFFFFF"/>

  <!-- 客户端 -->
  <rect x="20" y="96" width="180" height="104" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="36" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0F172A">WorkBuddy</text>
  <text x="36" y="148" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">只给三格填</text>
  <rect x="36" y="160" width="148" height="24" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="46" y="176" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#B91C1C">无处填请求头</text>

  <!-- 代理 -->
  <rect x="280" y="60" width="340" height="176" rx="10" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="294" y="86" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8">本机代理 · :8787</text>
  <text x="294" y="120" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#1E40AF">① 补 x-opencode-session</text>
  <text x="294" y="148" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#1E40AF">② 按会话分流</text>
  <text x="294" y="176" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#1E40AF">③ 回填真实思考</text>
  <text x="294" y="212" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#64748B">凭据只转发，不存</text>

  <!-- 上游 -->
  <rect x="700" y="96" width="180" height="104" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="716" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0F172A">OpenCode Go</text>
  <text x="716" y="148" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#334155">认头 · 认密钥</text>

  <!-- 去程（蓝，上） -->
  <path d="M200 122 L280 122" stroke="#2563EB" stroke-width="2.5" fill="none" marker-end="url(#aBlue)"/>

  <path d="M620 122 L700 122" stroke="#2563EB" stroke-width="2.5" fill="none" marker-end="url(#aBlue)"/>

  <!-- 回程（青，下） -->
  <path d="M700 172 L620 172" stroke="#0D9488" stroke-width="2.5" fill="none" marker-end="url(#aTeal)"/>
  <text x="660" y="189" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#0D9488">流式响应</text>

  <path d="M280 172 L200 172" stroke="#0D9488" stroke-width="2.5" fill="none" marker-end="url(#aTeal)"/>
  <text x="240" y="189" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#0D9488">原样回传</text>


  <!-- 动画 -->
  <circle r="5" fill="#2563EB" opacity="0">
    <animate attributeName="cx" values="200;700" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="122;122" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.88;1" dur="3.6s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#0D9488" opacity="0">
    <animate attributeName="cx" values="700;200" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="172;172" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.88;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
